- type: entity
  id: ShipProjectilePlasmaTrap
  name: plasma trap
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    ignoreWeaponGrid: true
    damage:
      types:
        Heat: 26
        Structural: 8
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: blastwave
      shader: unshaded
  - type: Ammo
    muzzleFlash: null
  - type: ShipWeaponProjectile
  - type: IgnoresHullrotShields
  - type: TriggerOnCollide
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    totalIntensity: 34
    intensitySlope: 7
    maxIntensity: 18
  - type: ProjectileSpeedDecay
    stopAfterDistance: 300
  - type: TimedDespawn
    lifetime: 180
  - type: RadarBlip
    radarColor: "#6FC7FF"
    scale: 0.8
    requireNoGrid: true
  - type: PointLight
    radius: 1.4
    color: "#73C2FB"
    energy: 0.6

