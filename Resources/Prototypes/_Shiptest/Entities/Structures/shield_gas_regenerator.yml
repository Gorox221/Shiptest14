- type: entity
  id: ShieldGasRegenerator
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  name: плазменный регенератор щита
  description: Тратит накопленную газообразную плазму, чтобы быстро снять повреждения с энергетического щита, одновременно отключая его на время регенерации.
  placement:
    mode: SnapgridCenter
  components:
  - type: Machine
    board: ShieldGasRegeneratorMachineCircuitboard
  - type: Sprite
    sprite: _Shiptest/Structures/Machines/shield_regenerator
    snapCardinals: true
    granularLayersRendering: true
    layers:
    - state: regeneratorOff
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
    - state: pipe
      map: [ "enum.PipeVisualLayers.Pipe" ]
      renderingStrategy: Default
  - type: Appearance
  - type: PipeColorVisuals
  - type: Rotatable
  - type: AtmosPipeColor
  - type: AtmosDevice
    joinSystem: true
  - type: PipeRestrictOverlap
  - type: NodeContainer
    nodes:
      pipe:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: South
  - type: Transform
    noRot: false
  - type: ApcPowerReceiver
    powerLoad: 2500
  - type: ShieldGasRegenerator
    fuelGas: "3"
    gasMixture:
      volume: 1000
    shieldHpPerFuelMole: 2.672224894447117
    fuelMolesPerSecond: 374.342
    activationDoAfter: 3
